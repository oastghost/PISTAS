worker_processes auto;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  server_tokens off;

  # Login brute force protection: 10 attempts a minute per address, burst of 5.
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  # Passive health checks: a backend that fails twice is left out for 5 seconds.
  upstream pistas_backend {
    server backend1:8000 max_fails=2 fail_timeout=5s;
    server backend2:8000 max_fails=2 fail_timeout=5s;
    server backend3:8000 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 80;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    # Requests carry a client-generated id and the backend is idempotent, so a request that
    # failed on one backend (including POST) can safely be sent to another.
    proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
    proxy_next_upstream_tries 3;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://pistas_backend;
    }

    # Checks the current password, so it gets the same brute force protection as the login.
    location = /api/auth/change-password {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://pistas_backend;
    }

    location /api/ {
      proxy_pass http://pistas_backend;
    }

    location = /health {
      proxy_pass http://pistas_backend;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
