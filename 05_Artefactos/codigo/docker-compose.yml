# Full stack: nginx (TLS, rate limit) -> 3 backends -> 3-node Galera cluster.
#   docker compose up -d --build
# Open https://localhost:8443 (self-signed certificate in development).
# For a single database node during development see docker-compose.dev.yml.

x-galera: &galera
  image: mariadb:11.4
  restart: unless-stopped
  entrypoint: ["/usr/local/bin/pistas-galera.sh"]
  environment: &galera-env
    MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    MARIADB_DATABASE: ${DB_NAME:-pistas}
    MARIADB_USER: ${DB_USER:-pistas}
    MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    BOOTSTRAP_NODE: galera1
  healthcheck:
    test: ["CMD-SHELL", "mariadb -uroot -p$$MARIADB_ROOT_PASSWORD -N -e \"SHOW STATUS LIKE 'wsrep_local_state_comment'\" | grep -q Synced"]
    interval: 5s
    timeout: 4s
    retries: 30
    start_period: 20s
  networks: [db]

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  environment: &backend-env
    DB_PORT: "3306"
    DB_NAME: ${DB_NAME:-pistas}
    DB_USER: ${DB_USER:-pistas}
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    JWT_MINUTES: ${JWT_MINUTES:-30}
    SEED_PASSWORD: ${SEED_PASSWORD:-}
    WSREP_SYNC_WAIT: "1"
    ANA_PHONE: ${ANA_PHONE:-+351 000 000 000 (simulado)}
  networks: [db, app]

services:
  galera1:
    <<: *galera
    hostname: galera1
    volumes:
      - galera1-data:/var/lib/mysql
      - ./db/galera/galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./db/galera/start.sh:/usr/local/bin/pistas-galera.sh:ro
  galera2:
    <<: *galera
    hostname: galera2
    volumes:
      - galera2-data:/var/lib/mysql
      - ./db/galera/galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./db/galera/start.sh:/usr/local/bin/pistas-galera.sh:ro
  galera3:
    <<: *galera
    hostname: galera3
    volumes:
      - galera3-data:/var/lib/mysql
      - ./db/galera/galera.cnf:/etc/mysql/conf.d/galera.cnf:ro
      - ./db/galera/start.sh:/usr/local/bin/pistas-galera.sh:ro

  # Runs once: applies db/migrations and seeds stands and staff accounts (idempotent).
  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "python -m app.migrate && python -m app.seed"]
    environment:
      <<: *backend-env
      DB_HOSTS: galera1,galera2,galera3
    depends_on:
      galera1: {condition: service_healthy}

  # Each backend prefers a different database node and fails over to the others.
  backend1:
    <<: *backend
    hostname: backend1
    environment: {<<: *backend-env, DB_HOSTS: "galera1,galera2,galera3"}
    depends_on:
      migrate: {condition: service_completed_successfully}
  backend2:
    <<: *backend
    hostname: backend2
    environment: {<<: *backend-env, DB_HOSTS: "galera2,galera3,galera1"}
    depends_on:
      migrate: {condition: service_completed_successfully}
  backend3:
    <<: *backend
    hostname: backend3
    environment: {<<: *backend-env, DB_HOSTS: "galera3,galera1,galera2"}
    depends_on:
      migrate: {condition: service_completed_successfully}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    depends_on:
      backend1: {condition: service_healthy}
      backend2: {condition: service_healthy}
      backend3: {condition: service_healthy}
    networks: [app]

networks:
  db:
  app:

volumes:
  galera1-data:
  galera2-data:
  galera3-data:
