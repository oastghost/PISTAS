# Throwaway 3-node Galera cluster for the WITHOUT OVERLAPS spike. Not the final deployment.
x-node: &node
  image: mariadb:11.4
  environment:
    MARIADB_ROOT_PASSWORD: spike
    MARIADB_DATABASE: spike

services:
  node1:
    <<: *node
    hostname: node1
    command: >
      --wsrep-new-cluster --wsrep-on=ON --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      --wsrep-cluster-address=gcomm://node1,node2,node3 --wsrep-node-address=node1
      --wsrep-sst-method=rsync --binlog-format=ROW --innodb-autoinc-lock-mode=2
      --bind-address=0.0.0.0
  node2:
    <<: *node
    hostname: node2
    depends_on: [node1]
    command: >
      --wsrep-on=ON --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      --wsrep-cluster-address=gcomm://node1,node2,node3 --wsrep-node-address=node2
      --wsrep-sst-method=rsync --binlog-format=ROW --innodb-autoinc-lock-mode=2
      --bind-address=0.0.0.0
  node3:
    <<: *node
    hostname: node3
    depends_on: [node1]
    command: >
      --wsrep-on=ON --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      --wsrep-cluster-address=gcomm://node1,node2,node3 --wsrep-node-address=node3
      --wsrep-sst-method=rsync --binlog-format=ROW --innodb-autoinc-lock-mode=2
      --bind-address=0.0.0.0
